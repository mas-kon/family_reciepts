[project]
name = "check-bot"
version = "0.1.0"
description = "Family expense tracker: Telegram receipt bot + web UI"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.143.3",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.11.2",
    "openai>=3.33.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
